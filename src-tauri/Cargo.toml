[package]
name = "qqkey"
version = "0.1.0"
description = "全域快速指令選取工具"
authors = ["Jeremy Wen <jeremy@jeremywen.com>"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qqkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# release 版沒有 console（main.rs 的 windows_subsystem = "windows"），
# 診斷訊息不落地成檔案就等於不存在。
tauri-plugin-log = "2.9.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 固定在 0.37：rusqlite 0.40 會帶進 libsqlite3-sys 0.38，
# 它的 build script 用了 unstable 的 cfg_select，在 Rust 1.92 stable 編不過。
rusqlite = { version = "0.37", features = ["bundled"] }
nucleo-matcher = "0.3.1"
regex = "1.13.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
# 備份與還原要選檔案。剪貼簿塞得下分享用的幾十筆，塞不下含使用統計的整份備份。
tauri-plugin-dialog = "2.7.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3.27.0"

